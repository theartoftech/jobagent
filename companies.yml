      Financial-management and small-business platform target with Atlanta opportunities.
      Prioritize backend and full-stack application engineering, Java/Spring where applicable,
      APIs, enterprise integrations, scalable systems, software architecture, testing,
      production support, technical leadership, and mentoring. Treat AI integration as a
      secondary fit signal unless the posting requires prior production AI/ML ownership.
