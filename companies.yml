companies:
  - name: Salesforce
    careers_url: https://www.salesforce.com/company/careers/jobs/
    human_search_url: "https://www.salesforce.com/company/careers/jobs/?search=Principal%20Software%20Engineer&country=United%20States%20of%20America&pagesize=20#results"
    notes: >
      Prioritize backend Java, enterprise SaaS, platform engineering, API, integration,
      CPQ, quote-to-cash, and Atlanta/Georgia/remote-friendly roles. Avoid Salesforce
      platform roles requiring Apex, LWC, Flow, Data Cloud, or Agentforce ownership
      unless clearly secondary.

  - name: MuleSoft
    careers_url: https://www.salesforce.com/company/careers/jobs/
    human_search_url: "https://www.salesforce.com/company/careers/jobs/?search=MuleSoft&country=United%20States%20of%20America&pagesize=20#results"
    notes: >
      Search as part of Salesforce. Prioritize backend API platform, integration runtime,
      Java, REST, enterprise integration, platform engineering, solution architecture,
      integration consulting, and technically deep advisory roles. Avoid sales-only
      presales, active-clearance, and MuleSoft-only roles requiring deep Anypoint/DataWeave
      experience unless they involve backend engineering, integration architecture, or
      technical delivery ownership.

  - name: Slack
    careers_url: https://www.salesforce.com/company/careers/jobs/
