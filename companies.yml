      - https://mastercard.wd1.myworkdayjobs.com/CorporateCareers
    title_aliases:
      - Lead Software Engineer
      - Staff Backend Software Engineer
      - Principal Software Engineer
      - Senior Software Engineer
    notes: >
      Payments and decisioning-platform target with Atlanta and Arlington opportunities.
      Prioritize senior backend and full-stack product engineering, Java, APIs, distributed
      systems, transaction processing, SQL/database-backed applications, testing,
      observability, secure coding, and technical leadership. Treat AI/ML, agentic tools,
      or decisioning-domain exposure as secondary unless the posting makes them mandatory.
      Avoid roles that are primarily data science, infrastructure operations, or frontend-only.

