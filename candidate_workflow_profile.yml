# Strict workflow profile for the candidate job-screening and resume gating.
# This file is intentionally conservative. It is used after discovery/scoring
# to decide whether a job should reach the human resume workflow.

salary_floor: 150000

unsupported_required_languages:
  - German

hybrid_allowed_metro_tokens:
  - Atlanta
  - Alpharetta
  - Sandy Springs
  - Dunwoody
  - Roswell
  - Marietta
  - Smyrna
  - Decatur
  - Brookhaven
  - Norcross
  - Peachtree Corners
  - Duluth
  - Johns Creek
  - Kennesaw
  - Douglasville
  - Lithia Springs

excluded_companies:
  - Temporal Technologies

excluded_role_title_markers:
  - pre-sales
  - presales
  - associate technical consultant

preferred_locations:
  - Remote US
  - Preferred State
  - Preferred City
  - Preferred Suburb
  - Nearby Suburb
  - Hybrid Preferred City
  - Commuting distance to Preferred City office

# A Senior/Lead opening at one of these companies may remain viable when its
# technical fit is strong, even if the title is below the candidate's current level.
strategic_companies:
  - Block
  - Stripe
  - Atlassian
  - Mastercard
  - Intuit
  - CVS Health
  - Elevance Health
  - Global Payments
  - NCR Voyix
  - ServiceNow
  - Workday
  - Apps Associates
  - Accenture
  - PwC
  - Cognizant
  - Infosys

# Exact-URL approvals for an otherwise high overqualified-risk role. Keep this
# posting-scoped so approval never transfers to a different requisition.
seniority_approvals: {}

confirmed_strengths:
  - Java
  - J2EE
  - Spring Boot
  - REST APIs
  - Oracle CPQ
  - quote-to-cash
  - pricing workflows
  - approvals workflows
  - document generation
  - Oracle DB
  - SQL
  - MySQL
  - PostgreSQL
  - Docker
  - Kubernetes-deployed applications
  - CI/CD
  - production troubleshooting
  - technical leadership
  - professional services
  - enterprise integrations
  - Unix/Linux
  - customer-facing technical delivery
  - forward deployed engineering
  - customer-facing software engineering
  - deployment into customer environments

allowed_with_care:
  - JavaScript
  - Oracle JET
  - Python deployment automation
  - AI-assisted development with Codex
  - IBM MQ
  - MSMQ
  - OCI
  - Kubernetes application support
  - technical consulting
  - solution architecture

do_not_claim:
  - React
  - Angular
  - Vue
  - TypeScript professional experience
  - Ruby on Rails
  - Go
  - Kotlin
  - Python backend professional experience
  - AWS
  - Azure
  - GCP
  - Kafka
  - MongoDB
  - NoSQL
  - Salesforce Apex
  - LWC
  - Flows
  - Data Cloud
  - Agentforce
  - production RAG
  - embeddings
  - MCP servers
  - ledgering
  - settlement
  - treasury
  - double-entry accounting
  - Market Management Systems
  - Unit Commitment
  - Economic Dispatch

# Candidate-wide facts are answered once and reused for every posting. These
# answers suppress duplicate questions but do not erase a required skill gap.
candidate_gap_resolutions:
  React: do_not_claim
  Angular: do_not_claim
  Vue: do_not_claim
  TypeScript professional experience: do_not_claim
  Ruby on Rails: do_not_claim
  Go: do_not_claim
  Kotlin: do_not_claim
  Python backend professional experience: do_not_claim
  AWS: "limited_exposure: completed AWS workshops and BeSA training; no professional production deployment experience"
  Azure: do_not_claim
  GCP: "limited_exposure: completed GCP training through the Georgia public-library technology program; no professional production GCP experience"
  Kafka: do_not_claim
  MongoDB: do_not_claim
  NoSQL: do_not_claim
  Salesforce Apex: do_not_claim
  LWC: do_not_claim
  Flows: do_not_claim
  Data Cloud: do_not_claim
  Agentforce: "limited_exposure: completed BeSA training; no professional production Agentforce experience"
  production RAG: do_not_claim
  embeddings: do_not_claim
  MCP servers: do_not_claim
  ledgering: do_not_claim
  settlement: do_not_claim
  treasury: do_not_claim
  double-entry accounting: do_not_claim
  Market Management Systems: do_not_claim
  Unit Commitment: do_not_claim
  Economic Dispatch: do_not_claim

# Posting-specific answers override candidate-wide facts only for the exact URL.
# Use these for posting interpretation, including false-positive skill matches.
gap_resolutions:
  "https://mtb.wd5.myworkdayjobs.com/MTB/job/Remote-USA/Principal-Software-Engineer_R89645":
    JavaScript: "professional_evidence: advanced professional-level JavaScript knowledge through professional Oracle JET application development"
  "https://jobs.jobvite.com/ninjaone/job/o6cIAfwk":
    Kotlin: "posting_false_positive: the official role is explicitly centered on Java; Kotlin is part of the broader team stack and is not listed as a minimum qualification"
  "https://www.github.careers/early-in-profession/jobs/5481?lang=en-us":
    Azure: "posting_false_positive: Azure and AKS appear under Preferred Qualifications, not Required Qualifications"
  "https://ncr.wd1.myworkdayjobs.com/ext_us/job/ATLANTA-GA-USA/Senior-Software-Engineer--Multi-Cloud-_R0158101":
    GCP: "limited_exposure: completed GCP training through the Georgia public-library technology program; no professional production GCP experience"

hard_reject_if_primary:
  - React-heavy frontend
  - Angular-heavy frontend
  - Vue-heavy frontend
  - Ruby on Rails primary stack
  - Go primary stack
  - Python primary backend stack
  - Salesforce platform development
  - AWS/Terraform/EKS infrastructure
  - production AI/ML platform engineering
  - DevOps-only
  - SRE-only
  - active clearance required
  - West Coast office attendance required
  - international-only location

hard_screen_questions:
  - 4+ years React
  - 4+ years Angular
  - production Ruby/Rails
  - current Ruby/Rails production use
  - AWS required
  - GCP required
  - Azure required
  - active clearance required
  - current Salesforce Apex experience
  - current Go production experience
  - current Python backend production experience
  - ledgering or settlement experience required

resume_templates:
  software_engineering:
    use_for:
      - Java backend
      - enterprise SaaS
      - API/platform
      - CI/CD
      - production systems
      - SQL/database-heavy application engineering
  consulting_architecture:
    use_for:
      - solution architect
      - technical consultant
      - customer-facing technical architecture
      - professional services
      - implementation leadership
      - forward deployed engineer
      - forward deployed architect
  cpq_implementation:
    use_for:
      - CPQ implementation
      - quote-to-cash consulting
      - pricing/configuration workflows
      - Infor/Salesforce/Oracle CPQ adjacency
  technical_success:
    use_for:
      - success architect
      - customer architect
      - technical account architect
      - customer solutions architect

resume_workflow_policy:
  generate_for:
    - STRONG APPLY
    - APPLY
  allow_for_moderate_stretch_only_when:
    - gaps_are_preferred_not_required
    - role_has_clear_java_backend_or_cpq_or_consulting_core
    - salary_and_location_fit
    - missing_gap_answers_false
  never_generate_when:
    - EXTREME STRETCH
    - SKIP
    - required_experience_gap_present
    - hard_screen_question_failed
    - missing_gap_answers_true
